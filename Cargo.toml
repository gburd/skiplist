[package]
name = "splaylist"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["Gregory Burd <greg@burd.me>"]
license = "MIT OR Apache-2.0"
description = "A self-balancing skip list: an ordered map/set whose node heights adapt to the access pattern, so frequently-used keys become cheaper to reach."
documentation = "https://docs.rs/splaylist"
repository = "https://codeberg.org/gregburd/skiplist"
homepage = "https://codeberg.org/gregburd/skiplist"
readme = "README.md"
keywords = ["skiplist", "splaylist", "ordered-map", "adaptive", "data-structure"]
categories = ["data-structures", "no-std"]
exclude = [
    "/.github",
    "/.forgejo",
    "/fuzz",
    "/comparison",
    "/hegel-tests",
    "/benches/results",
    "AGENTS.md",
    "/.agent",
]

[features]
default = ["std"]
# Pull in libstd. Disable (and keep `alloc` available) for `no_std` targets.
std = []
# Serialize/Deserialize a map or set via serde. The serialized form is the
# logical key/value sequence; node heights and access counters are not
# persisted and are reconstructed on load.
serde = ["dep:serde"]
# Emit a GraphViz DOT description of the internal level structure, useful
# for debugging and for visualising how the structure adapts.
dot = []

[dependencies]
serde = { version = "1", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
criterion = "0.5"
serde_json = "1"

[[bench]]
name = "splaylist"
harness = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.bench]
debug = true
