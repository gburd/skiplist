name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Mirror of .github/workflows/ci.yml for Forgejo Actions / Codeberg CI.
# Keep the two files in sync.
#
# NOT mirrored: the `macos` job from .github/workflows/ci.yml.  Codeberg's
# shared Forgejo runners only offer the `docker` label (Linux containers);
# there is no macOS host to schedule a job on, and a job whose `runs-on`
# cannot be satisfied sits pending indefinitely rather than failing
# loudly.  macOS coverage therefore lives only in the GitHub mirror.

jobs:
  build:
    runs-on: docker
    container:
      image: docker.io/library/debian:bookworm
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y build-essential pkg-config valgrind gcovr python3
          if [ "${{ matrix.cc }}" = "clang" ]; then
            apt-get install -y clang
          fi
      - name: Default build + tests
        env:
          CC: ${{ matrix.cc }}
        run: |
          make test
          make test_concurrent
          make test_single
          make test_splay
          make run_examples
          make bench/bench
      - name: TSAN (gcc only)
        if: matrix.cc == 'gcc'
        env:
          CC: gcc
        run: |
          make test_tsan
          make test_tsan_splay
      - name: Valgrind (gcc only)
        if: matrix.cc == 'gcc'
        env:
          CC: gcc
        run: make valgrind
      - name: Coverage (gcc only)
        if: matrix.cc == 'gcc'
        env:
          CC: gcc
        run: make coverage
